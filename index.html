<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 16px;
  background-color: #fafafa;
}

h1 {
  margin-bottom: 12px;
}

.style-header {
  margin-top: 20px;
  padding: 10px 0;
  border-bottom: 2px solid #ddd;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}

.style-header::after {
  content: "▾";
  font-size: 1.2em;
  transition: transform 0.2s ease;
}

.style-header.open::after {
  transform: rotate(180deg);
}

.style-content {
  display: none;
}

.bier {
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.naam {
  font-weight: 600;
}

.info {
  font-size: 0.9em;
  color: #555;
}
</style>

Papa.parse(csvData, {
  header: true,
  delimiter: ";",
  skipEmptyLines: true,
  complete: function(results) {

    const data = results.data;
    const grouped = {};
    const order = [];

    data.forEach(bier => {
      if (!grouped[bier.bierstyle]) {
        grouped[bier.bierstyle] = [];
        order.push(bier.bierstyle);
      }
      grouped[bier.bierstyle].push(bier);
    });

    const container = document.getElementById("bierkaart");

    order.forEach(style => {

      const header = document.createElement("div");
      header.className = "style-header";
      header.textContent = style;

      const content = document.createElement("div");
      content.className = "style-content";

      header.addEventListener("click", () => {
        const open = content.style.display === "block";
        content.style.display = open ? "none" : "block";
        header.classList.toggle("open", !open);
      });

      container.appendChild(header);
      container.appendChild(content);

      grouped[style].forEach(bier => {
        const div = document.createElement("div");
        div.className = "bier";
        div.innerHTML = `
          <div class="naam">${bier.naam}</div>
          <div class="info">${bier.alcohol} • ${bier.prijs}</div>
        `;
        content.appendChild(div);
      });

    });
  }
});
