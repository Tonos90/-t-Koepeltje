<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bierkaart</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: #f5f5f5;
  color: #000;
}

header {
  background: #ffffff;
  padding: 16px;
  text-align: center;
  font-size: 1.4em;
  font-weight: bold;
  border-bottom: 1px solid #ddd;
}

.container {
  padding: 10px;
}

.style {
  background: #ffffff;
  margin-bottom: 8px;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #ddd;
}

.style-header {
  padding: 14px;
  font-weight: bold;
  cursor: pointer;
  background: #f0f0f0;
}

.style-header::after {
  content: "▼";
  float: right;
}

.style.open .style-header::after {
  content: "▲";
}

.beer-list {
  display: none;
}

.style.open .beer-list {
  display: block;
}

.beer {
  display: flex;
  justify-content: space-between;
  padding: 10px 14px;
  border-top: 1px solid #eee;
  font-size: 0.95em;
}

.beer-name {
  font-weight: bold;
}

.beer-meta {
  font-size: 0.85em;
  color: #555;
}

.price {
  font-weight: bold;
}
</style>

</head>

<body>

<header>🍺Bierkaart 't Koepeltje</header>
<div class="container" id="bierkaart">Laden…</div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRu9pxoGYHq73GwvfGRRCbI6nnegsG4Dte8RDhj0wEe-QkNSGQngcwtAOWNJDroKkddn-HQNAbythXV/pub?gid=0&single=true&output=csv";

fetch(SHEET_URL)
  .then(res => res.text())
  .then(csv => {
    const data = parseCSV(csv)
      .filter(r => r.present === true);
    render(data);
  })
  .catch(err => {
    document.getElementById("bierkaart").innerHTML =
      "Fout bij laden van bierkaart.";
    console.error(err);
  });

function parseCSV(text) {
  const rows = [];
  let current = [];
  let value = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {
      value += '"';
      i++;
    } else if (char === '"') {
      insideQuotes = !insideQuotes;
    } else if (char === ',' && !insideQuotes) {
      current.push(value);
      value = "";
    } else if (char === '\n' && !insideQuotes) {
      current.push(value);
      rows.push(current);
      current = [];
      value = "";
    } else {
      value += char;
    }
  }

  if (value) {
    current.push(value);
    rows.push(current);
  }

  rows.shift(); // headers verwijderen

  return rows.map(r => ({
    style: r[0]?.trim(),
    naam: r[1]?.trim(),
    alcohol: r[2]?.trim(),
    prijs: r[3]?.trim(),
    present: r[4]?.trim().toUpperCase() === "TRUE"
  }));
}

function render(bieren) {
  const container = document.getElementById("bierkaart");
  container.innerHTML = "";

  const grouped = {};
  bieren.forEach(b => {
    if (!grouped[b.style]) grouped[b.style] = [];
    grouped[b.style].push(b);
  });

  Object.keys(grouped).forEach(style => {
    const block = document.createElement("div");
    block.className = "style";

    const header = document.createElement("div");
    header.className = "style-header";
    header.textContent = style;
    header.onclick = () => block.classList.toggle("open");

    const list = document.createElement("div");
    list.className = "beer-list";

    grouped[style].forEach(b => {
      const beer = document.createElement("div");
      beer.className = "beer";
      beer.innerHTML = `
        <div>
          <span class="beer-name">${b.naam}</span>
          <span class="beer-meta">${b.alcohol}</span>
        </div>
        <div class="price">${b.prijs}</div>
      `;
      list.appendChild(beer);
    });

    block.appendChild(header);
    block.appendChild(list);
    container.appendChild(block);
  });
}
</script>
</body>
</html>
