// --- Parse CSV ---
const rows = csvData.trim().split('\n');
const headers = rows.shift().split(';');
const bierData = rows.map(r=>{
  const cols = r.split(';');
  return { style: cols[0].trim(), naam: cols[1].trim(), alcohol: cols[2].trim(), prijs: cols[3].trim() }
});

// Unieke styles
const styles = [...new Set(bierData.map(b=>b.style))];

// --- LocalStorage voor beheer status ---
const STORAGE_KEY = "bierkaart_checked";
let checkedItems = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

// --- Functie: maak accordion ---
function maakAccordion(container, data, editable=false){
  container.innerHTML = "";
  styles.forEach(style=>{
    const items = data.filter(b=>b.style===style);
    const styleDiv = document.createElement("div");
    styleDiv.classList.add("style-section");

    const header = document.createElement("div");
    header.className="style-header";
    header.innerHTML = `<span>${style}</span><span class="arrow">▶</span>`;
    styleDiv.appendChild(header);

    const listDiv = document.createElement("div");
    listDiv.className="bier-items";

    items.forEach(item=>{
      const itemDiv = document.createElement("div");
      itemDiv.className="bier-item";
      const id = `${style}_${item.naam}`.replace(/\s/g,'_');
      const checked = checkedItems[id]? 'checked':'';
      if(editable){
        itemDiv.innerHTML = `<input type="checkbox" id="${id}" ${checked}><label for="${id}">${item.naam} | ${item.alcohol} | ${item.prijs}</label>`;
        const checkbox = itemDiv.querySelector("input");
        checkbox.addEventListener("change", ()=>{
          checkedItems[id] = checkbox.checked;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(checkedItems));
          toonHome(); // update home automatisch
        });
      } else {
        // alleen tonen als aangevinkt
        if(checkedItems[id]){
          itemDiv.textContent = `${item.naam} | ${item.alcohol} | ${item.prijs}`;
        } else {
          itemDiv.style.display="none";
        }
      }
      listDiv.appendChild(itemDiv);
    });

    styleDiv.appendChild(listDiv);
    container.appendChild(styleDiv);

    // Accordion toggle
    header.addEventListener("click", ()=>{
      const isActive = header.classList.contains("active");
      document.querySelectorAll(".style-header").forEach(h=>h.classList.remove("active"));
      document.querySelectorAll(".bier-items").forEach(l=>l.style.display="none");
      if(!isActive){
        header.classList.add("active");
        listDiv.style.display="block";
      }
    });
  });
}

// --- Toon home ---
function toonHome(){
  const homeDiv = document.getElementById("home");
  maakAccordion(homeDiv, bierData, false);
}

// --- Toon beheer ---
function toonBeheer(){
  maakAccordion(beheerDiv, bierData, true);
}

// --- Init ---
toonHome();
toonBeheer();
