<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bierkaart 't Koepeltje</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #000;
    }

    header span {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.4em;
      font-weight: bold;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #ffffff;
      padding: 14px 16px;
      border-bottom: 1px solid #ddd;
      display: flex;
      white-space: nowrap;
      align-items: center;
      justify-content: flex-end;
    }

    #toggleAll {
      font-size: 1.2em;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 10px;
    }

    .container {
      padding: 10px;
    }

    .style {
      background: #ffffff;
      margin-bottom: 8px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .style-header {
      padding: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #f0f0f0;
      position: relative;
    }

    .style-header::after {
      content: "▼";
      position: absolute;
      right: 14px;
    }

    .style.open .style-header::after {
      content: "▲";
    }

    .beer-list {
      display: none;
    }

    .style.open .beer-list {
      display: block;
    }

    .beer {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      border-top: 1px solid #eee;
      font-size: 0.95em;
    }

    .beer-info {
      flex: 1;
      min-width: 0;
    }

    .beer-name {
      font-weight: bold;
      display: block;
      word-break: break-word;
    }

    .beer-meta {
      font-size: 0.85em;
      color: #555;
    }

    .price {
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 70px;
      text-align: right;
    }

    .info-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin-left: 6px;
      border-radius: 50%;
      background: #1e88e5;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
    }

    .info-link:hover {
      background: #1565c0;
    }
  </style>
</head>

<body>

<header>
  <span>🍺 Bierkaart 't Koepeltje</span>
  <button id="toggleAll" aria-label="Alles open/dicht">??</button>
</header>

<div class="container" id="bierkaart">Laden…</div>

<script>
const SHEET_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRu9pxoGYHq73GwvfGRRCbI6nnegsG4Dte8RDhj0wEe-QkNSGQngcwtAOWNJDroKkddn-HQNAbythXV/pub?gid=0&single=true&output=csv";

fetch(SHEET_URL)
  .then(res => res.text())
  .then(csv => {
    const data = parseCSV(csv)
      .filter(b => b.present)
      .sort((a, b) => a.order - b.order);
    render(data);
  })
  .catch(err => {
    document.getElementById("bierkaart").innerHTML =
      "Fout bij laden van bierkaart.";
    console.error(err);
  });

function parseCSV(text) {
  const rows = [];
  let current = [];
  let value = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {
      value += '"';
      i++;
    } else if (char === '"') {
      insideQuotes = !insideQuotes;
    } else if (char === ',' && !insideQuotes) {
      current.push(value);
      value = "";
    } else if (char === '\n' && !insideQuotes) {
      current.push(value);
      rows.push(current);
      current = [];
      value = "";
    } else {
      value += char;
    }
  }

  if (value) {
    current.push(value);
    rows.push(current);
  }

  rows.shift(); // header verwijderen

  return rows.map(r => ({
    order: parseInt(r[0], 10) || 0,
    style: r[1].trim(),
    naam: r[2].trim(),
    alcohol: r[3].trim(),
    prijs: r[4].trim(),
    present: r[5].trim().toUpperCase() === "TRUE",
    info: r[6] ? r[6].trim() : ""
  }));
}

function render(bieren) {
  const container = document.getElementById("bierkaart");
  container.innerHTML = "";

  const grouped = {};
  bieren.forEach(b => {
    if (!grouped[b.style]) grouped[b.style] = [];
    grouped[b.style].push(b);
  });

  Object.keys(grouped).forEach(style => {
    const block = document.createElement("div");
    block.className = "style";

    const header = document.createElement("div");
    header.className = "style-header";
    header.textContent = style;
    header.onclick = () => block.classList.toggle("open");

    const list = document.createElement("div");
    list.className = "beer-list";

    grouped[style].forEach(b => {
      const beer = document.createElement("div");
      beer.className = "beer";
      beer.innerHTML = `
        <div class="beer-info">
          <span class="beer-name">${b.naam}</span>
          <span class="beer-meta">${b.alcohol}</span>
        </div>
        <div class="price">
          ${b.prijs}
          ${b.info ? `<a href="${b.info}" target="_blank" class="info-link">i</a>` : ""}
        </div>
      `;
      list.appendChild(beer);
    });

    block.appendChild(header);
    block.appendChild(list);
    container.appendChild(block);
  });
}

let allesOpen = false;
document.getElementById("toggleAll").addEventListener("click", () => {
  const styles = document.querySelectorAll(".style");
  allesOpen = !allesOpen;

  styles.forEach(style => {
    style.classList.toggle("open", allesOpen);
  });

  document.getElementById("toggleAll").textContent = allesOpen ? "⬆︎" : "⬇︎";
});
</script>

</body>
</html>
