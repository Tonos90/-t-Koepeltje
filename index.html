<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bierkaart</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: #111;
  color: #fff;
}

header {
  background: #000;
  padding: 16px;
  text-align: center;
  font-size: 1.4em;
  font-weight: bold;
}

.container {
  padding: 10px;
}

.style {
  background: #1c1c1c;
  margin-bottom: 8px;
  border-radius: 8px;
  overflow: hidden;
}

.style-header {
  padding: 14px;
  font-weight: bold;
  cursor: pointer;
  background: #222;
}

.style-header::after {
  content: "▼";
  float: right;
}

.style.open .style-header::after {
  content: "▲";
}

.beer-list {
  display: none;
}

.style.open .beer-list {
  display: block;
}

.beer {
  display: flex;
  justify-content: space-between;
  padding: 10px 14px;
  border-top: 1px solid #333;
  font-size: 0.95em;
}

.beer span {
  display: block;
}

.beer-name {
  font-weight: bold;
}

.beer-meta {
  font-size: 0.85em;
  opacity: 0.8;
}

.price {
  font-weight: bold;
}
</style>
</head>

<body>

<header>Bierkaart</header>
<div class="container" id="bierkaart">Laden…</div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRu9pxoGYHq73GwvfGRRCbI6nnegsG4Dte8RDhj0wEe-QkNSGQngcwtAOWNJDroKkddn-HQNAbythXV/pub?gid=0&single=true&output=csv";

fetch(SHEET_URL)
  .then(res => res.text())
  .then(csv => {
    const lines = csv.trim().split('\n');
    lines.shift(); // headers weg

    const data = lines.map(line => {
      const cols = line.split(',');
      return {
        style: cols[0]?.trim(),
        naam: cols[1]?.trim(),
        alcohol: cols[2]?.trim(),
        prijs: cols[3]?.trim(),
        present: cols[4]?.trim().toUpperCase() === "TRUE"
      };
    }).filter(b => b.present);

    render(data);
  })
  .catch(() => {
    document.getElementById("bierkaart").innerHTML = "Kon bierkaart niet laden.";
  });

function render(bieren) {
  const container = document.getElementById("bierkaart");
  container.innerHTML = "";

  const grouped = {};
  bieren.forEach(b => {
    if (!grouped[b.style]) grouped[b.style] = [];
    grouped[b.style].push(b);
  });

  Object.keys(grouped).forEach(style => {
    const block = document.createElement("div");
    block.className = "style";

    const header = document.createElement("div");
    header.className = "style-header";
    header.textContent = style;
    header.onclick = () => block.classList.toggle("open");

    const list = document.createElement("div");
    list.className = "beer-list";

    grouped[style].forEach(b => {
      const beer = document.createElement("div");
      beer.className = "beer";
      beer.innerHTML = `
        <div>
          <span class="beer-name">${b.naam}</span>
          <span class="beer-meta">${b.alcohol}</span>
        </div>
        <div class="price">${b.prijs}</div>
      `;
      list.appendChild(beer);
    });

    block.appendChild(header);
    block.appendChild(list);
    container.appendChild(block);
  });
}
</script>

</body>
</html>
